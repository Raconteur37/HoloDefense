<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="glow-empty-up" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer hex border -->
  <rect x="2" y="2" width="60" height="60" rx="10" ry="10"
        fill="none" stroke="#1a2a3a" stroke-width="2"/>

  <!-- Inner panel bg -->
  <rect x="4" y="4" width="56" height="56" rx="8" ry="8"
        fill="#0d1720" fill-opacity="0.85"/>

  <!-- Corner brackets TL -->
  <polyline points="4,16 4,4 16,4" fill="none" stroke="#2ee8ff" stroke-width="1.5" stroke-linecap="round"/>
  <!-- TR -->
  <polyline points="48,4 60,4 60,16" fill="none" stroke="#2ee8ff" stroke-width="1.5" stroke-linecap="round"/>
  <!-- BL -->
  <polyline points="4,48 4,60 16,60" fill="none" stroke="#2ee8ff" stroke-width="1.5" stroke-linecap="round"/>
  <!-- BR -->
  <polyline points="48,60 60,60 60,48" fill="none" stroke="#2ee8ff" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Arrow outline only (UP) -->
  <polygon points="32,10 52,42 40,42 40,56 24,56 24,42 12,42"
           fill="none"
           stroke="#2ee8ff" stroke-width="2"
           stroke-linejoin="round"
           filter="url(#glow-empty-up)"
           opacity="0.55"/>
</svg>
