<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="fill-grad-up" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#a0f4ff"/>
      <stop offset="100%" stop-color="#1fb8d4"/>
    </linearGradient>
    <filter id="glow-filled-up" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="inner-glow-up" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer border lit up -->
  <rect x="2" y="2" width="60" height="60" rx="10" ry="10"
        fill="none" stroke="#2ee8ff" stroke-width="1.5" opacity="0.6"/>

  <!-- Panel bg with tint -->
  <rect x="4" y="4" width="56" height="56" rx="8" ry="8"
        fill="#081820" fill-opacity="0.95"/>

  <!-- Ambient panel glow -->
  <rect x="4" y="4" width="56" height="56" rx="8" ry="8"
        fill="#2ee8ff" fill-opacity="0.06"/>

  <!-- Corner brackets bright -->
  <polyline points="4,16 4,4 16,4" fill="none" stroke="#2ee8ff" stroke-width="2" stroke-linecap="round"/>
  <polyline points="48,4 60,4 60,16" fill="none" stroke="#2ee8ff" stroke-width="2" stroke-linecap="round"/>
  <polyline points="4,48 4,60 16,60" fill="none" stroke="#2ee8ff" stroke-width="2" stroke-linecap="round"/>
  <polyline points="48,60 60,60 60,48" fill="none" stroke="#2ee8ff" stroke-width="2" stroke-linecap="round"/>

  <!-- Arrow filled + glowing (UP) -->
  <polygon points="32,10 52,42 40,42 40,56 24,56 24,42 12,42"
           fill="url(#fill-grad-up)"
           filter="url(#glow-filled-up)"
           opacity="0.95"/>

  <!-- Specular sheen -->
  <polygon points="32,12 46,38 38,38 38,50 33,50 33,38 20,38"
           fill="white" opacity="0.08"/>

  <!-- Crisp stroke on top -->
  <polygon points="32,10 52,42 40,42 40,56 24,56 24,42 12,42"
           fill="none"
           stroke="#a0f4ff" stroke-width="1.5"
           stroke-linejoin="round"/>
</svg>
