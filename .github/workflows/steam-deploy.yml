name: Deploy to Steam Beta

on:
  push:
    branches:
      - main
  workflow_dispatch: # Adds a manual run button in the Actions tab

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Godot
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.6.2-stable/Godot_v4.6.2-stable_linux.x86_64.zip
          unzip -q Godot_v4.6.2-stable_linux.x86_64.zip
          mv Godot_v4.6.2-stable_linux.x86_64 /usr/local/bin/godot
          chmod +x /usr/local/bin/godot

      - name: Install Export Templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates/4.6.2.stable
          wget -q https://github.com/godotengine/godot/releases/download/4.6.2-stable/Godot_v4.6.2-stable_export_templates.tpz
          unzip -q Godot_v4.6.2-stable_export_templates.tpz -d /tmp/templates
          mv /tmp/templates/templates/* ~/.local/share/godot/export_templates/4.6.2.stable/

      - name: Export Godot Project
        run: |
          mkdir -p build
          godot --headless --export-release "Holo_Defense_Closed_Alpha_V1.0.0" build/HoloDefense.x86_64
          godot --headless --export-release "Holo_Defense_Closed_Alpha_V1.0.0_Windows" build/HoloDefense.exe

      - name: Make binary executable
        run: |
          chmod +x build/HoloDefense.x86_64

      - name: Deploy to Steam
        uses: game-ci/steam-deploy@v3
        with:
          username: ${{ secrets.STEAM_USERNAME }}
          configVdf: ${{ secrets.STEAM_CONFIG_VDF }}
          appId: 4758080
          buildDescription: Automated build from GitHub Actions
          rootPath: build
          depot1Path: .
          releaseBranch: alpha
